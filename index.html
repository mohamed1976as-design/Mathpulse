<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MathPulse AI 3.0 — منصة الإدارة الصفية الذكية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Cairo', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #0B1120; color: #F8FAFC; margin: 0; padding: 0; overflow-x: hidden; }
    .glass-card { background: rgba(19, 28, 49, 0.94); border: 1px solid rgba(56, 189, 248, 0.24); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
    .tab-btn { transition: all 0.2s ease; white-space: nowrap; }
    .tab-btn.active { background: linear-gradient(135deg, #2563EB, #0EA5E9); color: #fff; border-color: #38BDF8; box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4); }
    .action-pill.selected { transform: scale(1.04); box-shadow: 0 0 18px rgba(56, 189, 248, 0.55); border-color: #fff !important; }
    .student-card { transition: transform 0.15s ease, border-color 0.2s ease; }
    .student-card:active { transform: scale(0.97); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulseGlow { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    .pulse-live { animation: pulseGlow 2s infinite; }
    @keyframes stampPop { 0% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .stamp-mark { position: absolute; transform: translate(-50%, -50%); animation: stampPop 0.2s ease-out forwards; pointer-events: none; user-select: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85)); }
    @media print {
      body * { visibility: hidden; }
      #certificatePrintArea, #certificatePrintArea * { visibility: visible; }
      #certificatePrintArea { position: fixed; inset: 0; width: 100%; height: 100%; background: #fff !important; color: #0f172a !important; z-index: 9999; display: flex !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ==================== شاشة الدخول ==================== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#070B14] via-[#0F172A] to-[#1E1B4B]">
    <div class="glass-card max-w-2xl w-full p-6 md:p-8 border-2 border-sky-500/30">
      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-bold mb-3">
          <span>🔒 مزامنة سحابية محمية</span>
          <span>•</span>
          <span>منهج كامبردج - سلطنة عُمان</span>
        </div>
        <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-l from-sky-400 via-cyan-300 to-emerald-400">
          MathPulse AI 3.0
        </h1>
        <p class="text-slate-300 text-sm mt-2">منصة الإدارة الصفية الذكية والتقويم التشخيصي — أ. محمد منصور</p>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-bold text-sky-300 mb-2">1. اختر صفة الدخول:</label>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
          <button type="button" onclick="selectRole('معلم', this)" class="role-btn selected p-3 rounded-xl bg-sky-600/30 border-2 border-sky-400 text-white font-bold text-sm text-center">👨‍🏫 معلم</button>
          <button type="button" onclick="selectRole('معلم أول', this)" class="role-btn p-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 font-bold text-sm text-center">📋 معلم أول</button>
          <button type="button" onclick="selectRole('إداري', this)" class="role-btn p-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 font-bold text-sm text-center">🏫 إداري</button>
          <button type="button" onclick="selectRole('مدير مدرسة', this)" class="role-btn p-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 font-bold text-sm text-center">🎖️ مدير مدرسة</button>
        </div>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-bold text-emerald-300 mb-2">2. اختر الشعبة الدراسية:</label>
        <div class="grid grid-cols-3 gap-2.5">
          <button type="button" onclick="selectLoginClass('السابع 6', this)" class="lclass-btn p
